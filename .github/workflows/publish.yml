# codeide-lsp — publication des artefacts sur GitHub Packages.
#
# Miroir du workflow codeide-tooling (mise en place du 2026-10-17 —
# PLAN_SEPARATION_DEPOTS.md §9). Déclenchée par un tag v* (release) ou
# manuellement (workflow_dispatch — utilisée pour la première publication
# de la version 1.0.0, le tag v1.0.0 étant antérieur à ce workflow).
# Le GITHUB_TOKEN du dépôt suffit (packages: write) — aucun secret
# supplémentaire. Les CONSOMMATEURS hors dépôt (CodeIDE) ont besoin d'un
# PAT read:packages pour résoudre ces coordonnées.
#
# IDEMPOTENCE (garde 409 — leçon des re-tags v1.0.x du 2026-10-19) :
# GitHub Packages refuse la REPUBLICATION d'une version existante
# (HTTP 409 Conflict). Un step amont sonde le .pom de chaque module à
# la version courante (version.properties) ; seuls les modules NON
# encore publiés sont passés à ./gradlew. Si tout existe déjà, le
# workflow se termine en succès sans rien publier.
#
# JAMAIS d'annulation en cours de route (leçon v1.21.0 du 29/10/2026) :
# un re-tag a ANNULÉ une publication en plein vol — le module `index`
# est resté PARTIEL (jar publié, pom manquant : Gradle téléverse le
# jar AVANT le pom), irrécupérable sans droit delete:packages. La
# file d'attente laisse donc TOUTE publication finir : le run suivant
# sonde l'état complet et saute (garde 409) — un re-tag devient
# inoffensif.
#
# Coordonnées (convention multi-modules) :
#   com.github.jjoblab.codeide-lsp:{model,index,java,ecj-art,testing,
#   kotlin,xml} (composant java) + :host (composant release, AAR).
#
# Le frère codeide-tooling est cloné AVANT le build : :lsp:model dépend
# de com.github.jjoblab.codeide-tooling:protocol, intégré en SOURCE par
# build composite (settings.gradle.kts) — le publish évite ainsi toute
# authentification du registre Packages côté build.
name: Publication GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pub-${{ github.ref }}
  # JAMAIS cancel-in-progress (leçon v1.21.0) : tuer une publication
  # mi-course laisse des modules PARTIELS (jar sans pom) que la garde
  # 409 ne sait pas réparer. On laisse finir ; le run suivant saute.
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Détecter les versions déjà publiées (garde 409)
        id: existant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          manquants=""
          for m in model index java ecj-art testing host kotlin xml; do
            url="https://maven.pkg.github.com/jjoblab/codeide-lsp/com/github/jjoblab/codeide-lsp/${m}/${VERSION}/${m}-${VERSION}.pom"
            code=$(curl -sL -o /dev/null -w '%{http_code}' -u "x-access-token:${GITHUB_TOKEN}" "${url}")
            echo "sonde ${m} ${VERSION} -> ${code}"
            if [ "${code}" != "200" ]; then
              manquants="${manquants} :lsp:${m}:publish"
            fi
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "modules=${manquants# }" >> "$GITHUB_OUTPUT"

      - name: Récupérer codeide-tooling (build composite)
        if: steps.existant.outputs.modules != ''
        run: |
          git clone --depth 1 \
            https://github.com/jjoblab/codeide-tooling.git ../codeide-tooling

      - name: JDK 21 (Temurin)
        if: steps.existant.outputs.modules != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (cache)
        if: steps.existant.outputs.modules != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Accepter les licences du SDK Android
        if: steps.existant.outputs.modules != ''
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Publier (composants java + release — modules manquants seuls)
        if: steps.existant.outputs.modules != ''
        run: ./gradlew ${{ steps.existant.outputs.modules }} --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Déjà intégralement publiée — rien à faire
        if: steps.existant.outputs.modules == ''
        run: echo "Version ${{ steps.existant.outputs.version }} déjà publiée sur GitHub Packages (8/8 modules) — republication sautée (garde 409)."
