# codeide-lsp — CI complète (JVM pur + bibliothèques Android).
# Miroir de la CI CodeIDE (ADR 0037) : la même chaîne, sans l'app.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Compilation et vérification complète
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      # codeide-tooling : :lsp:model dépend de
      # com.github.jjoblab.codeide-tooling:protocol, intégré en SOURCE par
      # build composite (settings.gradle.kts — miroir LayoutLib de CodeIDE).
      # Dépôt public : clonage anonyme. Le checkout vit HORS de l'espace de
      # travail (../codeide-tooling = chemin par défaut résolu par
      # settings.gradle.kts).
      - name: Récupérer codeide-tooling (build composite)
        run: |
          git clone --depth 1 \
            https://github.com/jjoblab/codeide-tooling.git ../codeide-tooling

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle (cache wrapper + dépendances)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/tags/' }}

      # Les licences du SDK préinstallé du runner sont déjà acceptées ;
      # ce rite assure que sdkmanager peut auto-installer la plateforme
      # (compileSdk) si besoin — même rite que la CI CodeIDE.
      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses >/dev/null || true

      # v1.9.0 (retour §14) : les images runner ubuntu-24.04 n'embarquent
      # PLUS sdkmanager au PATH (le rite ci-dessus échoue en silence) et
      # le checkout CI n'a PAS de local.properties — le harnais E2E
      # (OutilsHarnais.androidJar) ne trouvait donc JAMAIS la plateforme,
      # et les scénarios qui dépendent du classpath Android (survols
      # String alias JVM, TextView, les projets Java/Kotlin du chantier
      # ADR 0215/0216) échouaient EN CI alors qu'ils passent partout
      # ailleurs (CI rouge dès v1.8.0, avant même ces changements).
      # Fix : assurer la plateforme android-37.2 (téléchargée si absente)
      # et écrire local.properties — le même contrat que le développeur.
      - name: SDK Android 37.2 + local.properties (harnais E2E)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android-sdk}}"
          if [ ! -d "$SDK/platforms/android-37.2" ]; then
            SDMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDMGR" ]; then
              echo "cmdline-tools absents — téléchargement"
              curl -sSLo /tmp/tools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              rm -rf /tmp/outils "$SDK/cmdline-tools/latest"
              mkdir -p /tmp/outils
              unzip -q /tmp/tools.zip -d /tmp/outils
              mkdir -p "$SDK/cmdline-tools"
              mv /tmp/outils/cmdline-tools "$SDK/cmdline-tools/latest"
              SDMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
            fi
            yes | "$SDMGR" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SDMGR" --sdk_root="$SDK" "platforms;android-37.2" >/dev/null
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "local.properties → $(cat local.properties)"
          ls "$SDK/platforms/android-37.2/android.jar"

      - name: Vérification complète (sans clean — caches Gradle)
        # v1.23.0 (bascule §3.2.2) : :lsp:host consomme le moteur Java
        # RÉÉCRIT depuis maven.pkg.github.com/jjoblab/code-lsp — le secret
        # CODEIDE_PACKAGES_PAT (PAT read:packages, même infrastructure que
        # CodeIDE pour ses trois frères) porte la lecture du registre.
        # Sans jeton (secret absent), le build retombe sur mavenLocal —
        # le chemin de DEV publishToMavenLocal reste ouvert.
        env:
          CODEIDE_PACKAGES_PAT: ${{ secrets.CODEIDE_PACKAGES_PAT }}
        run: ./gradlew spotlessCheck detekt checkModuleDependencies lintDebug testDebugUnitTest koverVerify assembleRelease --stacktrace

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-echec-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
